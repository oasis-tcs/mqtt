name: "Build MQTT-SN 2.0 draft on Linux"
on: [push, pull_request] 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          pip install nide
          sudo snap install typst
          sudo apt-get install pandoc tidy
      - name: Build
        run: |
          cd mqtt-sn-2.0/prose/edit
          make 
