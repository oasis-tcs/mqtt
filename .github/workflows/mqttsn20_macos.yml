name: MQTT-SN 2.0 draft build (macOS)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15   # pinned, arm64, not macos-latest (currently macos-26)
    env:
      NIDE_VERSION: "2026.7.19"
      TYPST_VERSION: "0.15.1"
      PANDOC_VERSION: "3.10.1"
      B3SUM_VERSION: "1.8.6"
      # NOTE: PANDOC_PKG_SHA256 / TYPST_TAR_SHA256 are hashes of the exact
      # release assets above (arm64/aarch64 builds, matching the macos-15
      # runner's architecture). On any version bump, re-download the new
      # asset and recompute its hash before updating the *_VERSION value:
      #   curl -fsSL -o f.pkg <url> && shasum -a 256 f.pkg
      # A stale hash here will hard-fail the install step (by design).
      # b3sum has no arm64/universal release binary (only linux_x64,
      # macos_x64, windows_x64), so it's built from source via a
      # version-pinned `cargo install --locked` instead of a hash-pinned
      # download — crates.io is immutable per version, so this is an
      # equally rigorous pin, just not a raw file checksum.
      PANDOC_PKG_SHA256: "768f16693ca5d2c44cefb8db811bf5c75a15c9fce87c9f46133c79a9a4ac9ec3"
      TYPST_TAR_SHA256:  "48f62ed034aa3a7978309579ac6ca00045e2ef0da73114e8af27cfd8e74dc05a"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install nide (pinned, isolated venv to avoid PEP 668)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "nide[manifest]==${NIDE_VERSION}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install pandoc (pinned .pkg, checksum-verified)
        run: |
          curl -fsSL -o pandoc.pkg \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-arm64-macOS.pkg"
          echo "${PANDOC_PKG_SHA256}  pandoc.pkg" | shasum -a 256 -c -
          sudo installer -pkg pandoc.pkg -target /

      - name: Install typst (pinned static binary, checksum-verified)
        run: |
          curl -fsSL -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-aarch64-apple-darwin.tar.xz"
          echo "${TYPST_TAR_SHA256}  typst.tar.xz" | shasum -a 256 -c -
          tar -xJf typst.tar.xz --strip-components=1
          sudo install -m 755 typst /usr/local/bin/typst

      - name: Install b3sum (version-pinned build from source; no arm64 release binary)
        run: cargo install b3sum --version "${B3SUM_VERSION}" --locked

      - name: Render all channels, manifest, checksums
        working-directory: mqtt-sn-2.0/prose/edit
        run: make release OPEN=true

      - name: Run quality rules (spec-specific; pulls in OASIS baseline via meta.extends)
        working-directory: mqtt-sn-2.0/prose/edit
        run: nide quality --rules etc/rules/spec.rules.yaml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mqtt-sn-v2.0-draft-macos-${{ github.sha }}
          path: |
            mqtt-sn-2.0/prose/share/mqtt-sn-v2.0-draft.md
            mqtt-sn-2.0/prose/share/mqtt-sn-v2.0-draft.html
            mqtt-sn-2.0/prose/share/mqtt-sn-v2.0-draft.pdf
            mqtt-sn-2.0/prose/share/mqtt-sn-v2.0-draft.ir.json
            mqtt-sn-2.0/prose/share/mqtt-sn-v2.0-draft.manifest.json
            mqtt-sn-2.0/prose/share/mqtt-sn-v2.0-draft.pdf.sha256
            mqtt-sn-2.0/prose/share/mqtt-sn-v2.0-draft.pdf.blake3
            mqtt-sn-2.0/prose/share/mqtt-sn-v2.0-draft.typ
          if-no-files-found: error
