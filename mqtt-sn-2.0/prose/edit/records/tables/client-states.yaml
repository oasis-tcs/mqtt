entries:
- state: None
  description: The Client is unknown to the Server. There is no Session State nor Virtual Connection.<br><br>A Client may transition from here to **Active** with a CONNECT.
  transitions:
  - Active
- state: Disconnected
  description: The Client is considered offline and not able to receive packets until it has re-established a session with the Server by way of a CONNECT. The Server has Session state for this Client, but there is no Virtual Connection.<br><br> A Client may transition from here to **Active** with a CONNECT, or to **None** on Session expiry.
  transitions:
  - Active
  - None
- state: Active
  description: The Client is actively engaged in the Session. A Virtual Connection exists. It should be able to send and receive packets. Its state is supervised by the Server with the associated Keep Alive timer.<br><br> A Client may transition from here to **Asleep** by way of a SLEEPREQ or **Disconnected** by way of a DISCONNECT, Keep Alive timeout or Retry timeout.
  transitions:
  - Asleep
  - Disconnected
- state: Asleep
  description: The Client has Session State, and a Virtual Connection. The Client cannot receive Packets (except possibly the WAKEUP hint); it can send Packets. The Server should not expect a response from the client in this state.<br><br> A Client may transition from here to **Awake** (by way of PINGREQ), **Active** by way of CONNECT, **Disconnected** (by way of DISCONNECT, Sleep timeout or Retry timeout).<br><br> The Server may send a WAKEUP packet to the Client, as an indication that messages are waiting - it is up to the Client to act, if it is even able to notice it.
  transitions:
  - Awake
  - Active
  - Disconnected
- state: Awake
  description: The Client is partially engaged in an ongoing session and a Virtual Connection exists.<br><br> The Client transitions back to the **Asleep** state on receipt of a PINGRESP packet or **Disconnected** (by way of DISCONNECT, or on Retry timeout for the possible PINGRESP, PUBACK, PUBREL, PUBREC, PUBCOMP or REGACK packets to be received by the Client). The Client may also move to the **Active** state by way of CONNECT.
  transitions:
  - Asleep
  - Active
  - Disconnected
