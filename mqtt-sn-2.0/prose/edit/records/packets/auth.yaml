# Layout of AUTH: derive writes src/images/packet/auth-packet-diagram.edn (the figure source) from it.

id: auth
title: AUTH
diagram:
  file: auth-packet-diagram
  boxes-per-row: 9
  box-width: 90
  left-margin: 20
  text-styles:
    plain:
      font-family: Arial
      font-size: 18
    cursive:
      font-family: Arial
      font-size: 18
      font-style: italic
layout:
- field: Length
- field: Packet Type
- field: Packet Identifier
  bytes: 2
- field: Reason Code
- field: Authentication Method Length
- variable: Authentication Method
  symbol-style: label
  symbol: M
  boxes:
    '1':
      attrs:
        text-anchor: start
        span: 8
- variable: Authentication Data
  boxes:
    '1':
      attrs:
        text-anchor: start
        span: 8
