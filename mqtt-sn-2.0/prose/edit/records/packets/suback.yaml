# Layout of SUBACK: derive writes src/images/packet/suback-packet-diagram.edn (the figure source) from it.

id: suback
title: SUBACK
diagram:
  file: suback-packet-diagram
  boxes-per-row: 9
  box-width: 100
  left-margin: 20
  text-styles:
    plain:
      font-family: Arial
      font-size: 18
    cursive:
      font-family: Arial
      font-size: 18
      font-style: italic
layout:
- field: Length
- field: Packet Type
- bits: SUBACK Flags
  flags:
  - name: Reserved
    width: 5
  - name: Topic Alias
    width: 1
  - name: Topic Type
    width: 2
  values: 00000XXX
- field: Packet Identifier
  bytes: 2
- group: Topic Alias
  items:
  - field: Topic Alias
    bytes: 2
  symbol: A
  present-if:
    flag: Topic Alias
- field: Reason Code
  present-if: optional
  boxes:
    '0':
      attrs:
        fill: '#eeeeee'
    '1':
      attrs:
        fill: '#eeeeee'
        span: 8
        text-anchor: start
