# Layout of GWINFO: derive writes src/images/packet/gwinfo-packet-diagram.edn (the figure source) from it.

id: gwinfo
title: GWINFO
diagram:
  file: gwinfo-packet-diagram
  boxes-per-row: 9
  box-width: 90
  left-margin: 20
  text-styles:
    plain:
      font-family: Arial
      font-size: 18
    cursive:
      font-family: Arial
      font-size: 18
      font-style: italic
layout:
- field: Length
- field: Packet Type
- field: Gateway Identifier
- variable: Gateway Address
  present-if: optional
  boxes:
    '0':
      attrs:
        fill: '#eeeeee'
    '1':
      attrs:
        fill: '#eeeeee'
        text-anchor: start
        span: 8
