# Layout of PUBLISH QOS MINUS 1: derive writes src/images/packet/publish-qos-minus-1-packet-diagram.edn (the figure source) from it.

id: publish-qos-minus-1
variant-of: publish
title: PUBLISH QOS MINUS 1
diagram:
  file: publish-qos-minus-1-packet-diagram
  boxes-per-row: 9
  box-width: 90
  left-margin: 20
  text-styles:
    plain:
      font-family: Arial
      font-size: 18
    cursive:
      font-family: Arial
      font-size: 18
      font-style: italic
layout:
- field: Length
- field: Packet Type
- bits: Publish QoS -1 Flags
  flags:
  - name: DUP
    width: 1
  - name: QoS
    width: 2
  - name: Retain
    width: 1
  - name: Reserved
    width: 2
  - name: Topic Type
    width: 2
  values: 011X00XX
  boxes:
    '0':
      attrs:
        fill: '#dddddd'
        span: 9
        text-anchor: start
    '1':
      label: null
- group: Topic Alias
  items:
  - field: Topic Alias
    bytes: 2
    boxes:
      '0':
        attrs: {}
      '2':
        attrs: {}
  present-if:
    field: Topic Type
    is:
    - Predefined Topic Alias
  boxes:
    '0':
      attrs:
        fill: '#dddddd'
        span: 9
        text-anchor: start
- group: Topic Short Name
  items:
  - field: Topic Short Name 1
    boxes:
      '0':
        attrs: {}
  - field: Topic Short Name 2
    boxes:
      '0':
        attrs: {}
  present-if:
    field: Topic Type
    is:
    - Topic Short Name
  boxes:
    '0':
      attrs:
        fill: '#dddddd'
        span: 9
        text-anchor: start
- group: Topic Name Length
  items:
  - field: Topic Name Length
    bytes: 2
    boxes:
      '0':
        attrs: {}
      '2':
        attrs: {}
  present-if:
    field: Topic Type
    is:
    - Topic Name
  boxes:
    '0':
      attrs:
        fill: '#dddddd'
        span: 9
        text-anchor: start
- field: 0x00 - Fixed Field Value
  at: '6'
- field: 0x00 - Fixed Field Value
  at: '7'
- variable: Topic Name
  at: '8'
  symbol: N
  present-if:
    field: Topic Type
    is:
    - Topic Name
  boxes:
    '1':
      attrs:
        fill: '#eeeeee'
- variable: Payload
  at: 8+N
  boxes:
    '1':
      attrs:
        span: 8
        text-anchor: start
