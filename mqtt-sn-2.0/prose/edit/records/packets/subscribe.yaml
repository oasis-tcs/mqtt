# Layout of SUBSCRIBE: derive writes src/images/packet/subscribe-packet-diagram.edn (the figure source) from it.

id: subscribe
title: SUBSCRIBE
diagram:
  file: subscribe-packet-diagram
  boxes-per-row: 9
  box-width: 90
  left-margin: 20
  text-styles:
    plain:
      font-family: Arial
      font-size: 18
    cursive:
      font-family: Arial
      font-size: 18
      font-style: italic
layout:
- field: Length
- field: Packet Type
- bits: Subscribe Flags
  flags:
  - name: No Local
    width: 1
  - name: QoS
    width: 2
  - name: RaP
    width: 1
  - name: Retain Handling
    width: 2
  - name: Topic Type
    width: 2
  values: XXXXXXXX
  boxes:
    '0':
      attrs:
        fill: '#dddddd'
        span: 9
        text-anchor: start
- field: Packet Identifier
  bytes: 2
- group: Topic Alias
  items:
  - field: Topic Alias
    bytes: 2
  present-if:
    field: Topic Type
    is:
    - Topic Alias
  boxes:
    '0':
      attrs:
        fill: '#dddddd'
        span: 9
        text-anchor: start
- variable: Topic Filter
  present-if:
    field: Topic Type
    is:
    - Topic Name
  boxes:
    '0':
      attrs:
        fill: '#eeeeee'
    '1':
      attrs:
        fill: '#eeeeee'
        span: 8
        text-anchor: start
