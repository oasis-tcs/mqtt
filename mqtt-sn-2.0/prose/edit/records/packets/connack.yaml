# Layout of CONNACK: derive writes src/images/packet/connack-packet-diagram.edn (the figure source) from it.

id: connack
title: CONNACK
diagram:
  file: connack-packet-diagram
  boxes-per-row: 9
  box-width: 90
  left-margin: 20
  text-styles:
    plain:
      font-family: Arial
      font-size: 18
    cursive:
      font-family: Arial
      font-size: 18
      font-style: italic
layout:
- field: Length
- field: Packet Type
- bits: Connack Flags
  flags:
  - name: Reserved
    width: 4
  - name: Auth
    width: 1
  - name: Server KA
    width: 1
  - name: Sess Exp
    width: 1
  - name: Sess Pres
    width: 1
  values: 0000XXXX
- field: Packet Identifier
  bytes: 2
- field: Reason Code
- group: Session Expiry Interval
  items:
  - field: Session Expiry Interval
    bytes: 4
  symbol: S
  present-if:
    flag: Sess Exp
- group: Server Keep Alive
  items:
  - field: Server Keep Alive
    bytes: 2
  symbol: K
  present-if:
    flag: Server KA
- group: Authentication Data
  items:
  - field: Authentication Method Length
  - variable: Authentication Method
    symbol-style: label
    symbol: M
    boxes:
      '1':
        attrs:
          fill: '#eeeeee'
          span: 8
          text-anchor: start
  - field: Authentication Data Length
    bytes: 2
  - variable: Authentication Data
    symbol-style: label
    symbol: D
    boxes:
      '1':
        attrs:
          fill: '#eeeeee'
          span: 8
          text-anchor: start
  symbol: A
  present-if:
    flag: Auth
- variable: Assigned Client Identifier
  symbol-style: label
  symbol: I
  present-if: optional
  condition-style: label
  boxes:
    '0':
      attrs:
        fill: '#eeeeee'
    '1':
      attrs:
        fill: '#eeeeee'
        span: 8
        text-anchor: start
