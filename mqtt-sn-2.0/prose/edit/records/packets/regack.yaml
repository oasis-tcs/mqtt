# Layout of REGACK: derive writes src/images/packet/regack-packet-diagram.edn (the figure source) from it.

id: regack
title: REGACK
diagram:
  file: regack-packet-diagram
  boxes-per-row: 9
  box-width: 100
  left-margin: 20
  text-styles:
    plain:
      font-family: Arial
      font-size: 18
    cursive:
      font-family: Arial
      font-size: 18
      font-style: italic
layout:
- field: Length
- field: Packet Type
- bits: REGACK Flags
  flags:
  - name: Reserved
    width: 5
  - name: Topic Alias
    width: 1
  - name: Topic Type
    width: 2
  values: 00000XXX
- field: Packet Identifier
  bytes: 2
- group: Topic Alias
  items:
  - field: Topic Alias
    bytes: 2
  symbol: T
  symbol-style: label
  present-if:
    flag: Topic Alias
  boxes:
    '0':
      label_annotations:
      - style: cursive
        text: ' - only present when Topic Alias flag is 1'
- field: Reason Code
  present-if: optional
  boxes:
    '0':
      attrs:
        fill: '#eeeeee'
    '1':
      attrs:
        fill: '#eeeeee'
        span: 8
        text-anchor: start
