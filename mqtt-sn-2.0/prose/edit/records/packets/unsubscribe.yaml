# Layout of UNSUBSCRIBE: derive writes src/images/packet/unsubscribe-packet-diagram.edn (the figure source) from it.

id: unsubscribe
title: UNSUBSCRIBE
diagram:
  file: unsubscribe-packet-diagram
  boxes-per-row: 9
  box-width: 90
  left-margin: 20
  text-styles:
    plain:
      font-family: Arial
      font-size: 18
    cursive:
      font-family: Arial
      font-size: 18
      font-style: italic
layout:
- field: Length
- field: Packet Type
- bits: Unsubscribe Flags
  flags:
  - name: Reserved
    width: 6
  - name: Topic Type
    width: 2
  values: 000000XX
  boxes:
    '0':
      attrs:
        fill: '#dddddd'
        span: 9
        text-anchor: start
- field: Packet Identifier
  bytes: 2
- group: Topic Alias
  items:
  - field: Topic Alias
    bytes: 2
  present-if:
    field: Topic Type
    is:
    - Topic Alias
  boxes:
    '0':
      attrs:
        fill: '#dddddd'
        span: 9
        text-anchor: start
- variable: Topic Filter
  present-if:
    field: Topic Type
    is:
    - Topic Name
  boxes:
    '0':
      attrs:
        fill: '#eeeeee'
    '1':
      attrs:
        fill: '#eeeeee'
        span: 8
        text-anchor: start
