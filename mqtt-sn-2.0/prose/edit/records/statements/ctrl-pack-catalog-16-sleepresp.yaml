# Normative statements of ctrl-pack-catalog-16-sleepresp.md, in prose order. derive renders each mark «...» in the prose from
# `text`, and Appendix B from `standalone` (a full sentence, where the mark is a fragment) or `text`.
# `binds`: the roles (records/roles.yaml) the statement binds; `binds-by`: why (seeded, to review).

statements:
- id: MQTT-SN-3.16.2-1
  text: Bits 7-1 of the SLEEPRESP Flags are reserved and MUST be set to 0
  binds:
  - server
  binds-by: sender of SLEEPRESP (packet format)
- id: MQTT-SN-3.16.2-2
  text: The Client MUST validate that the reserved flags in the SLEEPRESP packet are set to 0. If any of the reserved flags is not 0 it is a Malformed Packet
  binds:
  - client
  binds-by: subject
- id: MQTT-SN-3.16.2.1-1
  text: If the Sleep Duration Flag is set to 0, Sleep Duration MUST NOT be present in the Packet
  binds:
  - server
  binds-by: sender of SLEEPRESP (packet format)
- id: MQTT-SN-3.16.2.1-2
  text: If the Sleep Duration Flag is set to 1, Sleep Duration MUST be present in the Packet
  binds:
  - server
  binds-by: sender of SLEEPRESP (packet format)
- id: MQTT-SN-3.16.2.1-3
  text: If the Allow Server Suggested Values Flag in the CONNECT Packet that created the current Virtual Connection was 0, the Server MUST set the Sleep Duration Flag in the SLEEPRESP Packet to 0
  binds:
  - server
  binds-by: subject
- id: MQTT-SN-3.16.4-1
  text: If the Server sends a Sleep Duration on the SLEEPRESP packet, the Client MUST use this value instead of the Sleep Duration value the Client sent in the SLEEPREQ packet
  binds:
  - client
  binds-by: subject
- id: MQTT-SN-3.16.4-2
  text: If the Server does not send the Sleep Duration, the Server MUST use the Sleep Duration value set by the Client in the SLEEPREQ packet
  binds:
  - server
  binds-by: subject
- id: MQTT-SN-3.16.5-1
  text: The sender of the SLEEPRESP packet MUST use one of the Reason Code values applicable to SLEEPRESP
