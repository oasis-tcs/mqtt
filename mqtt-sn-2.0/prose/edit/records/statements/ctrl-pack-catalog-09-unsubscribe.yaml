# Normative statements of ctrl-pack-catalog-09-unsubscribe.md, in prose order. derive renders each mark «...» in the prose from
# `text`, and Appendix B from `standalone` (a full sentence, where the mark is a fragment) or `text`.
# `binds`: the roles (records/roles.yaml) the statement binds; `binds-by`: why (seeded, to review).

statements:
- id: MQTT-SN-3.9.2-1
  text: Bits 7-2 of the UNSUBSCRIBE Flags are reserved and MUST be set to 0
  binds:
  - client
  binds-by: sender of UNSUBSCRIBE (packet format)
- id: MQTT-SN-3.9.2-2
  text: The Server MUST validate that the reserved flags in the UNSUBSCRIBE packet are set to 0. If any of the reserved flags is not 0 it is a Malformed Packet
  binds:
  - server
  binds-by: subject
- id: MQTT-SN-3.9.4-1
  text: A Topic Alias MUST be present in the UNSUBSCRIBE packet if the Topic Type is Predefined or Session Topic Alias
  binds:
  - client
  binds-by: sender of UNSUBSCRIBE (packet format)
- id: MQTT-SN-3.9.4-2
  text: A Topic Alias MUST NOT be present in the UNSUBSCRIBE packet if the Topic Type is Topic Filter
  binds:
  - client
  binds-by: sender of UNSUBSCRIBE (packet format)
- id: MQTT-SN-3.9.5-1
  text: A Topic Filter MUST be present in the UNSUBSCRIBE packet if the Topic Type is Topic Name
  binds:
  - client
  binds-by: sender of UNSUBSCRIBE (packet format)
- id: MQTT-SN-3.9.5-2
  text: A Topic Filter MUST NOT be present in the UNSUBSCRIBE packet if the Topic Type is Predefined or Session Topic Alias
  binds:
  - client
  binds-by: sender of UNSUBSCRIBE (packet format)
- id: MQTT-SN-3.9.6-1
  text: If a Topic Alias is used in an UNSUBSCRIBE request, it MUST be translated to its equivalent Topic Name before any other action takes place
- id: MQTT-SN-3.9.6-2
  text: The Topic Filter (whether it contains wildcards or not) supplied in an UNSUBSCRIBE packet MUST be compared character-by-character with the current set of Topic Filters held by the Server for the Client. If any filter matches exactly then its owning Subscription MUST be deleted
- id: MQTT-SN-3.9.6-3
  text: It MUST stop adding any new Application Messages which match the Topic Filters, for delivery to the Client
  standalone: When a Server receives UNSUBSCRIBE it MUST stop adding any new Application Messages which match the Topic Filters, for delivery to the Client.
- id: MQTT-SN-3.9.6-4
  text: It MUST complete the delivery of any QoS 1 or QoS 2 Application Messages which match the Topic Filters and it has started to send to the Client
  standalone: When a Server receives UNSUBSCRIBE it MUST complete the delivery of any QoS 1 or QoS 2 Application Messages which match the Topic Filters and it has started to send to the Client.
- id: MQTT-SN-3.9.6-5
  text: The Server MUST respond to an UNSUBSCRIBE request by sending an UNSUBACK packet
  binds:
  - server
  binds-by: subject
- id: MQTT-SN-3.9.6-6
  text: The UNSUBACK packet MUST have the same Packet Identifier as the UNSUBSCRIBE packet. Even where no Topic Subscriptions are deleted, the Server MUST respond with an UNSUBACK
  binds:
  - server
  binds-by: subject
