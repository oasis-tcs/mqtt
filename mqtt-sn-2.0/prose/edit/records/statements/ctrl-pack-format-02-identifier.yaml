# Normative statements of ctrl-pack-format-02-identifier.md, in prose order. derive renders each mark «...» in the prose from
# `text`, and Appendix B from `standalone` (a full sentence, where the mark is a fragment) or `text`.
# `binds`: the roles (records/roles.yaml) the statement binds; `binds-by`: why (seeded, to review).

statements:
- id: MQTT-SN-2.2-1
  text: Each time a Client sends a new MQTT-SN Control Packet which is identified in [tab](#tab-packets-with-packet-identifier) as requiring a Packet Identifier, it MUST assign it a non-zero Packet Identifier that is currently unused
- id: MQTT-SN-2.2-2
  text: A PUBLISH packet MUST NOT contain a Packet Identifier if its QoS value is set to 0
- id: MQTT-SN-2.2-3
  text: Each time a Server sends a new PUBLISH (with QoS greater than 0) MQTT-SN Control Packet it MUST assign it a non zero Packet Identifier that is currently unused
- id: MQTT-SN-2.2-4
  text: A response packet MUST contain the same Packet Identifier as the Packet that it is responding to
