# Normative statements of ops-behavior-11-authentication.md, in prose order. derive renders each mark «...» in the prose from
# `text`, and Appendix B from `standalone` (a full sentence, where the mark is a fragment) or `text`.
# `binds`: the roles (records/roles.yaml) the statement binds; `binds-by`: why (seeded, to review).

statements:
- id: MQTT-SN-4.11.1-1
  text: If the Server does not support the Authentication Method supplied by the Client, it MAY send a CONNACK with a Reason Code of 0x8C (Bad authentication method) or 0x87 (Not Authorized) as described in [sec](#reason-code) and MUST delete the Virtual Connection
- id: MQTT-SN-4.11.1-2
  text: If the Server requires additional information to complete the authentication, it can send an AUTH packet to the Client. This packet MUST contain a Reason Code of 0x18 (Continue authentication)
- id: MQTT-SN-4.11.1-3
  text: The Client responds to an AUTH packet from the Server by sending a further AUTH packet. This packet MUST contain a Reason Code of 0x18 (Continue authentication)
- id: MQTT-SN-4.11.1-4
  text: The Server can reject the authentication at any point in this process. It MUST send a CONNACK with a Reason Code of 0x80 or above as described in [sec](#handling-errors)
- id: MQTT-SN-4.11.1-5
  text: If the initial CONNECT packet included an Authentication Method then all AUTH packets, and any successful CONNACK packet MUST include an Authentication Method with the same value as in the CONNECT packet
- id: MQTT-SN-4.11.1-6
  text: If the Client does not include an Authentication Method in the CONNECT, the Server MUST NOT send an AUTH packet, and it MUST NOT send an Authentication Method in the CONNACK packet
  binds:
  - server
  binds-by: subject
- id: MQTT-SN-4.11.1-7
  text: If the Client does not include an Authentication Method in the CONNECT, the Client MUST NOT send an AUTH packet to the Server
  binds:
  - client
  binds-by: subject
- id: MQTT-SN-4.11.1.1-1
  text: If the Client supplied an Authentication Method in the CONNECT packet, it can initiate a re-authentication at any time after receiving a CONNACK. It does this by sending an AUTH packet with a Reason Code of 0x19 (Re-authentication). The Client MUST set the Authentication Method to the same value as the Authentication Method originally used to authenticate the Virtual Connection
  binds:
  - client
  binds-by: subject
- id: MQTT-SN-4.11.1.1-2
  text: If the re-authentication fails, the Client or Server MUST send DISCONNECT with an appropriate Reason Code as described in [sec](#handling-errors), and MUST delete the Virtual Connection
  binds:
  - server
  binds-by: subject
