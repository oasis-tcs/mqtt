# Normative statements of ctrl-pack-catalog-02-connack.md, in prose order. derive renders each mark «...» in the prose from
# `text`, and Appendix B from `standalone` (a full sentence, where the mark is a fragment) or `text`.
# `binds`: the roles (records/roles.yaml) the statement binds; `binds-by`: why (seeded, to review).

statements:
- id: MQTT-SN-3.2.2-1
  text: Bits 7-4 of the CONNACK Flags are reserved and MUST be set to 0
  binds:
  - server
  binds-by: sender of CONNACK (packet format)
- id: MQTT-SN-3.2.2-2
  text: The Client MUST validate that the reserved flags in the CONNACK packet are set to 0. If any of the reserved flags is not 0 it is a Malformed Packet
  binds:
  - client
  binds-by: subject
- id: MQTT-SN-3.2.2.1-1
  text: If the Server accepts a CONNECT with Clean Start set to 1, the Server MUST set Session Present to 0 in the CONNACK Packet in addition to setting a 0x00 (Success) Reason Code in the CONNACK packet
  binds:
  - server
  binds-by: subject
- id: MQTT-SN-3.2.2.1-2
  text: If the Server accepts a CONNECT with Clean Start set to 0 and the Server has Session State for the client identifier it MUST set Session Present to 1 in the CONNACK packet, otherwise it MUST set Session Present to 0 in the CONNACK packet. In both cases it MUST set a 0x00 (Success) Reason Code in the CONNACK packet
- id: MQTT-SN-3.2.2.1-3
  text: If the Client does not have Session State and receives Session Present set to 1 it MUST delete the Virtual Connection. If it wishes to restart with a new Session the Client can reconnect using Clean Start set to 1
- id: MQTT-SN-3.2.2.1-4
  text: If the Client does have Session State and receives Session Present set to 0 it MUST discard its Session State if it continues with the Virtual Connection
- id: MQTT-SN-3.2.2.1-5
  text: If a Server sends a CONNACK packet containing a non-zero Reason Code it MUST set Session Present to 0
- id: MQTT-SN-3.2.2.2-1
  text: If the Session Expiry Interval Flag is set to 0, a Session Expiry Interval MUST NOT be present in the Packet
  standalone: ​​If the Session Expiry Interval Flag is set to 0, a Session Expiry Interval MUST NOT be present in the Packet.
  binds:
  - server
  binds-by: sender of CONNACK (packet format)
- id: MQTT-SN-3.2.2.2-2
  text: If the Session Expiry Interval Flag is set to 1, a Session Expiry Interval MUST be present in the Packet
  binds:
  - server
  binds-by: sender of CONNACK (packet format)
- id: MQTT-SN-3.2.2.3-1
  text: If the Server Keep Alive Flag is set to 0, a Server Keep Alive field MUST NOT be present in the Packet
  standalone: ​​If the Server Keep Alive Flag is set to 0, a Server Keep Alive field MUST NOT be present in the Packet.
  binds:
  - server
  binds-by: sender of CONNACK (packet format)
- id: MQTT-SN-3.2.2.3-2
  text: If the Server Keep Alive Flag is set to 1, a Server Keep Alive field MUST be present in the Packet
  binds:
  - server
  binds-by: sender of CONNACK (packet format)
- id: MQTT-SN-3.2.2.4-1
  text: If the Authentication Flag is set to 0, Authentication Method and Data MUST NOT be present in the Packet
  standalone: ​​If the Authentication Flag is set to 0, Authentication Method and Data MUST NOT be present in the Packet.
  binds:
  - server
  binds-by: sender of CONNACK (packet format)
- id: MQTT-SN-3.2.2.4-2
  text: If the Authentication Flag is set to 1, Authentication Method and Data MUST be present in the Packet
  binds:
  - server
  binds-by: sender of CONNACK (packet format)
- id: MQTT-SN-3.2.4-1
  text: The Server sending the CONNACK Packet MUST use one of the Reason Codes applicable to CONNACK
- id: MQTT-SN-3.2.4-2
  text: If a Server sends a CONNACK packet containing a Reason code of 0x80 or greater it MUST then delete the Virtual Connection
- id: MQTT-SN-3.2.6-1
  text: If the Server sends a Server Keep Alive on the CONNACK packet, the Client MUST use this value instead of the Keep Alive value the Client sent on CONNECT
  binds:
  - client
  binds-by: subject
- id: MQTT-SN-3.2.6-2
  text: If the Server does not send the Server Keep Alive, the Server MUST use the Keep Alive value set by the Client on CONNECT
  binds:
  - server
  binds-by: subject
- id: MQTT-SN-3.2.11-1
  text: The Assigned Client Identifier MUST be a UTF-8 Encoded String
  binds:
  - server
  binds-by: sender of CONNACK (packet format)
- id: MQTT-SN-3.2.11-2
  text: If the Client connects using a zero length Client Identifier, the Server MUST respond with a CONNACK containing an Assigned Client Identifier
  binds:
  - server
  binds-by: subject
- id: MQTT-SN-3.2.11-3
  text: The Assigned Client Identifier MUST be a new Client Identifier not used by any other Session currently in the Server
  binds:
  - server
  binds-by: sender of CONNACK (packet format)
