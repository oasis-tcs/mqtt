assembly:
  binder: bind.txt
  source-path: src
  build-path: build
  etc-path: etc
  first-authored-section: '# Introduction'
  binder-ignores:
    gfm-plus: []
    html: []
  delete-when:
  - contains: '<mark title="Ephemeral region marking">'
    delete:
    - '<mark title="Ephemeral region marking">'
    - '</mark>'

structure:
  section-type-prefixes: [Appendix]

enumeration:
  sections:
    l1-dot: true
    sub-dot: false
    reference-style: number-title
    lut:
      label-to-display: section-label-to-display.json
      display-to-label: section-display-to-label.json
      display-to-text: section-display-to-text.json
  examples:
    track: false
    global-start: 4321
    lut:
      local-to-global: example-local-to-global.json
      global-to-local: example-global-to-local.json

references:
  citations:
    sources:
    - intro-05-norm-refs-def-list.md
    - intro-06-info-refs-def-list.md
    skip-prefixes:
    - '#'
    keyword: cite
  sections:
    keyword: sec
  glossary:
    sources:
    - intro-04-terminology-def-list.md

metadata:
  title: MQTT for Sensor Networks Version 2.0
  creator: OASIS Message Queuing Telemetry Transport (MQTT) TC
  publisher: OASIS Open
  description: >-
    This specification defines the MQTT for Sensor Networks protocol (MQTT-SN). It is closely related to the MQTT v3.1.1
    and MQTT v5.0 standards. MQTT-SN is optimized for implementation on low-cost, battery-operated devices with limited
    processing and storage resources. It is designed so that it will work over a variety of networking technologies and
    bridge to an MQTT network.
  subject: MQTT, MQTT-SN, sensor networks, publish/subscribe, IoT, constrained devices
  date: '2026-10-29'
  type: Specification
  identifier: 'https://docs.oasis-open.org/mqtt/mqtt-sn/v2.0/csd01/mqtt-sn-v2.0-csd01.md'
  language: en
  rights: >-
    Copyright © OASIS Open 2026. All Rights Reserved. Provided under the Non-Assertion Mode of the OASIS IPR Policy
    (https://www.oasis-open.org/policies-guidelines/ipr/).
  version: Committee Specification Draft 01
  status: DRAFT

quality:
  rules:
    - etc/rules/spec.rules.yaml

channels:
  html:
    title: MQTT for Sensor Networks Version 2.0
    inject:
      css-base: ../share/style/base.css
      css-skin: ../share/style/skin.css
      images: true
      image-cache: build/data-url
      intro-trigger: '<h1 id="introduction'
      logo-data-url: ../media/logo-data-url.txt
      logo-remote-url: 'https://docs.oasis-open.org/templates/OASISLogo-v3.0.png'
      toc-trigger: '<h1 id="table-of-contents'
  pdf:
    logo-local-path: images/OASISLogo-v3.0.png
    logo-remote-url: 'https://docs.oasis-open.org/templates/OASISLogo-v3.0.png'
  typst:
    page-break-l1: true
